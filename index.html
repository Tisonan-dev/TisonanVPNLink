<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VPN Subscription Proxy</title>
</head>
<body>
    <pre id="output">Загрузка конфигурации...</pre>

<script>
    async function processSubscription() {
        // 1. Получаем оригинальную ссылку из параметра ?link=
        const urlParams = new URLSearchParams(window.location.search);
        const originalLink = urlParams.get('link');
        const outputElement = document.getElementById('output');

        if (!originalLink) {
            outputElement.textContent = "Ошибка: Не указана оригинальная ссылка в параметре ?link=";
            return;
        }

        // Название, которое вы хотите видеть в VPN-приложении
        const myNewTitle = "profile-title: Tisonan VPN";

        try {
            // 2. Скачиваем чистый текст через правильный адрес прокси AllOrigins
            // Мы обязательно используем encodeURIComponent, чтобы ссылка не ломалась внутри адреса
            const proxyUrl = "https://allorigins.win"; 
            const response = await fetch(proxyUrl + encodeURIComponent(originalLink));
            
            if (!response.ok) throw new Error("Не удалось загрузить оригинальную подписку");
            
            let text = await response.text();

            // 3. Находим оригинальный profile-title и заменяем его на ваш
            let modifiedText = text.replace(/profile-title:\s*.*/g, myNewTitle);

            // 4. Выводим измененный текст на экран для вашего VPN-приложения
            outputElement.textContent = modifiedText;
            
        } catch (error) {
            outputElement.textContent = "Ошибка обработки: " + error.message;
        }
    }

    // Запускаем функцию при открытии страницы
    processSubscription();
</script>

</body>
</html>
